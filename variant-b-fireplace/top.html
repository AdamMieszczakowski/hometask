<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Banner (1032x250)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 1032px;
      height: 250px;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }

    .ad-container {
      position: relative;
      width: 1032px;
      height: 250px;
      overflow: hidden;
      background-color: #0b1411;
    }

    .bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 1032px;
      height: 250px;
      background: url('assets/top/bg.jpg') no-repeat center top;
      background-size: cover;
      transform-origin: center center;
      will-change: transform;
    }

    /* Kontener wyśrodkowany na banerze (500px szerokości = 50% z 1000px) */
    .headline-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 114px;
      pointer-events: none;
    }

    /* Maski dla poszczególnych linii hasła */
    .line-mask {
      position: absolute;
      left: 0;
      width: 500px;
      overflow: hidden;
      will-change: transform, opacity;
    }

    .line-1 {
      top: 0;
      height: 38px;
    }

    .line-2 {
      top: 38px;
      height: 38px;
    }

    .line-3 {
      top: 76px;
      height: 38px;
    }

    /* Obrazek bazowy przesunięty w górę wewnątrz masek */
    .line-mask img {
      position: absolute;
      left: 0;
      width: 500px;
      height: auto;
      display: block;
    }

    .line-1 img { top: 0; }
    .line-2 img { top: -38px; }
    .line-3 img { top: -76px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

  <div class="ad-container" id="ad">
    <div class="bg" id="bg"></div>

    <div class="headline-wrapper">
      <div class="line-mask line-1" id="line1">
        <img src="assets/top/hl.png" alt="Headline line 1">
      </div>
      <div class="line-mask line-2" id="line2">
        <img src="assets/top/hl.png" alt="Headline line 2">
      </div>
      <div class="line-mask line-3" id="line3">
        <img src="assets/top/hl.png" alt="Headline line 3">
      </div>
    </div>
  </div>

  <script>
    const clickTag = window.clickTag || 'https://example.com/landing';
    document.getElementById('ad').addEventListener('click', () => {
      window.open(clickTag, '_blank');
    });

    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function buildTimeline() {
      const tl = gsap.timeline({ paused: true });

      if (prefersReducedMotion) {
        gsap.set(['#bg', '#line1', '#line2', '#line3'], { opacity: 1, y: 0, scale: 1 });
        return tl;
      }

      // 1. Tło wjeżdża płynnie
      tl.fromTo('#bg', 
        { scale: 1.05, opacity: 0.8 }, 
        { scale: 1.0, opacity: 1, duration: 2.2, ease: 'power2.out' }
      )
      // 2. Hasło buduje się linijka po linijce
      .fromTo(['#line1', '#line2', '#line3'],
        { opacity: 0, y: 15 },
        { 
          opacity: 1, 
          y: 0, 
          duration: 0.7, 
          stagger: 0.25, 
          ease: 'power3.out' 
        },
        '-=1.2'
      )
      // 3. Spokojne podtrzymanie ruchu do 30 sekund
      .to('#bg', {
        scale: 1.02,
        duration: 14,
        repeat: 1,
        yoyo: true,
        ease: 'sine.inOut'
      });

      return tl;
    }

    const mainTimeline = buildTimeline();

    window.addEventListener('message', (event) => {
      if (event.data && event.data.action === 'START_ANIMATION') {
        mainTimeline.restart();
      }
    });

    if (window.self === window.top) {
      mainTimeline.play();
    }
  </script>
</body>
</html>
