<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Banner (1032x250)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 1032px;
      height: 250px;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      background: transparent;
    }

    .ad-container {
      position: relative;
      width: 1032px;
      height: 250px;
      overflow: hidden;
      background-color: #0b1411;
    }

    .bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 1032px;
      height: 250px;
      background: url('assets/top/bg.jpg') no-repeat center top;
      background-size: cover;
      transform-origin: center center;
      will-change: transform;
    }

    /* Wyśrodkowany kontener na nagłówek */
    .headline-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 580px;
      height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* Trzy linie hasła animowane linijka po linijce */
    .hl-line {
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      text-align: center;
      letter-spacing: 0.5px;
      will-change: transform, opacity;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .hl-line-1 {
      font-size: 32px;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .hl-line-2 {
      font-size: 21px;
      line-height: 1.15;
    }

    .hl-line-3 {
      font-size: 21px;
      line-height: 1.15;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

  <div class="ad-container" id="ad">
    <div class="bg" id="bg"></div>

    <div class="headline-container">
      <div class="hl-line hl-line-1" id="line1">NATÜRLICH STARK</div>
      <div class="hl-line hl-line-2" id="line2">BEI HUSTENREIZ &</div>
      <div class="hl-line hl-line-3" id="line3">HALSSCHMERZEN.</div>
    </div>
  </div>

  <script>
    const clickTag = window.clickTag || 'https://example.com/landing';
    document.getElementById('ad').addEventListener('click', () => {
      window.open(clickTag, '_blank');
    });

    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function buildTimeline() {
      const tl = gsap.timeline({ paused: true });

      if (prefersReducedMotion) {
        gsap.set(['#bg', '#line1', '#line2', '#line3'], { opacity: 1, y: 0, scale: 1 });
        return tl;
      }

      // 1. Zoom tła
      tl.fromTo('#bg', 
        { scale: 1.05, opacity: 0.8 }, 
        { scale: 1.0, opacity: 1, duration: 2.2, ease: 'power2.out' }
      )
      // 2. Wejście hasła linia po linii (stagger)
      .fromTo(['#line1', '#line2', '#line3'],
        { opacity: 0, y: 18 },
        { 
          opacity: 1, 
          y: 0, 
          duration: 0.65, 
          stagger: 0.22, 
          ease: 'power3.out' 
        },
        '-=1.3'
      )
      // 3. Spokojny ruch do 30 sekund
      .to('#bg', {
        scale: 1.02,
        duration: 14,
        repeat: 1,
        yoyo: true,
        ease: 'sine.inOut'
      }, 'loop');

      return tl;
    }

    const mainTimeline = buildTimeline();

    window.addEventListener('message', (event) => {
      if (event.data && event.data.action === 'START_ANIMATION') {
        mainTimeline.restart();
      }
    });

    if (window.self === window.top) {
      mainTimeline.play();
    }
  </script>
</body>
</html>
