<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fireplace Ad - Preview</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #212121;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 0;
      overflow-x: auto;
    }

    /* Układ kominka: 320px (left) + 1032px (środek) + 320px (right) = 1672px */
    .fireplace-stage {
      display: flex;
      width: 1672px;
      min-width: 1672px;
      height: 975px;
      position: relative;
    }

    .ad-frame {
      border: none;
      display: block;
      flex-shrink: 0;
    }

    .frame-side {
      width: 320px;
      height: 975px;
    }

    /* Środkowa kolumna: u góry top.html (250px), na dole artykuł portalu */
    .center-column {
      width: 1032px;
      height: 975px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .frame-top {
      width: 1032px;
      height: 250px;
    }

    .publisher-content {
      width: 1032px;
      flex: 1;
      background: #ffffff;
      padding: 40px;
      color: #333;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .mock-header {
      height: 60px;
      background: #e2e8f0;
      border-radius: 6px;
    }

    .mock-banner {
      height: 180px;
      background: #cbd5e1;
      border-radius: 6px;
    }

    .mock-article {
      flex: 1;
      background: #f1f5f9;
      border-radius: 6px;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="fireplace-stage">
    <!-- Lewe skrzydło od samej góry do dołu -->
    <iframe id="frame-left" class="ad-frame frame-side" src="left.html"></iframe>

    <!-- Środkowa kolumna -->
    <div class="center-column">
      <iframe id="frame-top" class="ad-frame frame-top" src="top.html"></iframe>
      
      <div class="publisher-content">
        <div class="mock-header"></div>
        <div class="mock-banner"></div>
        <div class="mock-article">
          <h2>Przykładowy portal wydawcy</h2>
          <p style="margin-top: 10px; color: #64748b;">
            Obszar symulujący treść redakcyjną wewnątrz kominka reklamowego.
          </p>
        </div>
      </div>
    </div>

    <!-- Prawe skrzydło od samej góry do dołu -->
    <iframe id="frame-right" class="ad-frame frame-side" src="right.html"></iframe>
  </div>

  <script>
    function syncAllAds() {
      ['frame-top', 'frame-left', 'frame-right'].forEach(id => {
        const frame = document.getElementById(id);
        if (frame && frame.contentWindow) {
          frame.contentWindow.postMessage({ action: 'START_ANIMATION' }, '*');
        }
      });
    }

    window.addEventListener('load', () => {
      setTimeout(syncAllAds, 200);
    });
  </script>
</body>
</html>
